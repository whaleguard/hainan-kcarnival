        <a class="btn btn-light" href="#cities" data-t="hero2_cta_visit"></a>

  <!-- 02 TWO CITIES -->

    <div class="wrap cities-head">
      <span class="eyebrow" data-t="cities_eyebrow"></span>
      <h2 data-tt="cities_title"></h2>

    <p class="wrap img-note" data-t="img_note"></p>

    <div class="wrap exp-grid">
      <div class="exp-copy">
        <span class="eyebrow" data-t="exp_eyebrow"></span>
        <h2 data-tt="exp_title"></h2>
        <p class="lead" data-t="exp_text"></p>
      </div>
      <div class="exp-collage" aria-hidden="true">
        <figure class="c1"><img src="img-dance.jpg" alt="" loading="lazy"></figure>
        <figure class="c2"><img src="img-stage.jpg" alt="" loading="lazy"></figure>
        <figure class="c3"><img src="img-photobooth.jpg" alt="" loading="lazy"></figure>
      </div>
    </div>
    <div class="wrap tiles" id="tiles"></div>
  </section>

  <!-- 04 3D VENUE -->
  <section class="sec map-sec" id="map">
    <div class="wrap">
      <div class="sec-head dark"><span class="eyebrow" data-t="map_eyebrow"></span><div><h2 data-tt="map_title"></h2><p data-t="map_sub"></p></div></div>
      <div class="map-shell">
        <div class="map-top">
          <div class="tabs" role="tablist">
            <button type="button" role="tab" id="tab-A" data-venue="A" aria-selected="true"></button>
            <button type="button" role="tab" id="tab-B" data-venue="B" aria-selected="false"></button>
          </div>
          <div class="legend" id="legend"></div>
          <div class="map-tools">
            <button type="button" class="tool tool-go" id="btn-walk" data-t="walk_enter"></button>

            <button type="button" class="tool" id="btn-reset" data-t="reset"></button>
          </div>
        </div>
        <div class="map-filter" id="map-filter"></div>
        <div class="map-body">
          <div class="stage3d" id="stage3d">
            <div class="map-loading" id="map-loading" data-t="map_loading"></div>
            <div class="map-views" id="map-views" role="group" aria-label="View"></div>
            <div class="map-count" id="map-count"></div>
            <button type="button" class="walk-cta" id="walk-cta"><span data-t="walk_cta"></span><small data-t-alt="walk_cta"></small><i aria-hidden="true"></i></button>
          </div>
          <aside class="map-side">
            <div id="booth-card"></div>
            <div class="blist" id="booth-list"></div>
          </aside>
        </div>
      </div>
    </div>

      <div class="prog" id="programs"></div>

      <ol class="stepper" id="stepper"></ol>
      <div class="apply-grid">
        <form class="form" id="form" novalidate>
          <fieldset class="step" data-step="0">
            <legend class="step-h"><span data-step-title="0"></span></legend>
            <div class="pkg-pick" id="pkg-pick"></div>
            <div class="f full"><label for="f-pkg" class="sr"><span data-tf="pkg"></span></label><select id="f-pkg" name="pkg" class="sr-select"></select></div>
          </fieldset>
          <fieldset class="step" data-step="1" hidden>
            <legend class="step-h"><span data-step-title="1"></span></legend>
            <div class="f"><label for="f-venue"><span data-tf="venue"></span><span class="req">*</span></label><select id="f-venue" name="venue"></select></div>
            <div class="f"><label for="f-booth" data-tf="booth"></label><select id="f-booth" name="booth"></select></div>
            <div class="f"><label for="f-people" data-tf="people"></label><input id="f-people" name="people" type="number" min="0" max="10" value="1" inputmode="numeric"></div>
            <div class="f full"><span class="lbl" data-tf="addon"></span>

                <label class="ck"><input type="checkbox" id="f-log" name="log"><span data-tf="log"></span></label>

            </div>

            <div class="f"><label for="f-company"><span data-tf="company"></span><span class="req">*</span></label><input id="f-company" name="company" autocomplete="organization" required></div>
            <div class="f"><label for="f-person"><span data-tf="person"></span><span class="req">*</span></label><input id="f-person" name="person" autocomplete="name" required></div>
            <div class="f"><label for="f-phone"><span data-tf="phone"></span><span class="req">*</span></label><input id="f-phone" name="phone" type="tel" autocomplete="tel" required></div>
            <div class="f"><label for="f-msg" data-tf="msg"></label><input id="f-msg" name="msg"></div>
            <div class="f"><label for="f-email" data-tf="email"></label><input id="f-email" name="email" type="email" autocomplete="email"></div>
            <div class="f"><label for="f-cat"><span data-tf="cat"></span><span class="req">*</span></label><select id="f-cat" name="cat"></select></div>
            <div class="f full"><label for="f-products"><span data-tf="products"></span><span class="req">*</span></label><input id="f-products" name="products" required></div>
            <div class="f full"><label for="f-memo" data-tf="memo"></label><textarea id="f-memo" name="memo"></textarea></div>

            <button type="button" class="btn btn-dark" id="step-next" data-t="step_next"></button>
            <button class="btn btn-red" type="submit" id="step-submit" data-tf="submit" hidden></button>
          </div>
          <div class="done" id="done" hidden>
            <h3 data-t="done_title"></h3>
            <p data-t="done_text"></p>
            <textarea id="done-text" readonly aria-label="application"></textarea>
            <div class="btns"><button type="button" class="btn btn-dark" id="btn-copy" data-t="copy"></button><button type="button" class="btn btn-line" id="btn-edit" data-t="edit"></button></div>
          </div>
        </form>
        <aside class="est" id="est" aria-live="polite"></aside>
