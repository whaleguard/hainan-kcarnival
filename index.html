<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하이난 중한문화미식 카니발 2026–2027 · 참가업체 모집</title>
<meta name="description" content="하이커우 骑楼老街와 완닝 神州半岛에서 32일 동안 열리는 K-푸드·K-뷰티·K-컬처 축제. 한국 브랜드 참가업체 모집 · 3D 행사장 · 4개국어.">
<meta property="og:title" content="하이난 중한문화미식 카니발 2026–2027">
<meta property="og:description" content="海南中韩文化美食嘉年华 · Hainan Korea–China Culture & Food Carnival · 참가업체 모집">
<meta property="og:image" content="img-hero.jpg">
<meta name="theme-color" content="#071820">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23E2483D'/%3E%3Cpath d='M2 32a30 30 0 0 0 60 0z' fill='%2321456A'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%23071820' stroke='%23F2B84B' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;800&family=Noto+Sans+KR:wght@400;600;800&family=Noto+Sans+SC:wght@400;600;800&family=Noto+Serif+JP:wght@900&family=Noto+Serif+KR:wght@900&family=Noto+Serif+SC:wght@900&family=Outfit:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=1">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>

<header class="hdr">
  <div class="wrap">
    <a class="logo" href="#top" aria-label="Home">
      <span class="logo-mark" aria-hidden="true"></span>
      <span class="logo-txt"><b>HAINAN K-CARNIVAL</b><span data-t="logo_sub"></span></span>
    </a>
    <nav class="nav" id="nav">
      <a href="#about" data-nav="0"></a><a href="#venues" data-nav="1"></a><a href="#map" data-nav="2"></a><a href="#join" data-nav="3"></a><a href="#schedule" data-nav="4"></a><a href="#apply" data-nav="5"></a><a href="#faq" data-nav="6"></a>
    </nav>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="ko">한</button><button type="button" data-lang="zh">中</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="ja">日</button>
    </div>
    <a class="hdr-cta" href="#apply" data-t="hdr_cta"></a>
    <button class="menu-btn" id="menu-btn" type="button" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="hero-img"><img class="fade-img" src="img-hero.jpg" alt="" fetchpriority="high"></div>
    <div class="wrap">
      <span class="hero-badge"><i></i><span data-t="hero_badge"></span></span>
      <span class="kicker" data-t="hero_kicker"></span>
      <h1 data-th="hero_title"></h1>
      <p class="sub" data-t="hero_sub"></p>
      <div class="btns"><a class="btn btn-red" href="#apply" data-t="cta_apply"></a><a class="btn btn-ghost" href="#map" data-t="cta_map"></a></div>
      <div class="stats" id="stats"></div>
    </div>
  </section>
  <div class="dan-band" aria-hidden="true"></div>

  <section class="sec" id="about">
    <div class="wrap about-grid">
      <div class="sec-head" style="margin:0">
        <span class="eyebrow" data-t="about_eyebrow"></span>
        <h2 data-t="about_title"></h2>
        <p class="lead" data-t="about_text"></p>
      </div>
      <div class="pillars" id="pillars"></div>
    </div>
  </section>

  <section class="sec" id="venues" style="padding-top:0">
    <div class="wrap">
      <div class="sec-head"><span class="eyebrow" data-t="venues_eyebrow"></span><h2 data-t="venues_title"></h2><p data-t="venues_sub"></p></div>
      <div class="venues" id="venue-cards"></div>
    </div>
  </section>

  <section class="sec map-sec" id="map">
    <div class="wrap">
      <div class="sec-head"><span class="eyebrow" data-t="map_eyebrow"></span><h2 data-t="map_title"></h2><p data-t="map_sub"></p></div>
      <div class="map-shell">
        <div class="map-top">
          <div class="tabs" role="tablist">
            <button type="button" role="tab" id="tab-A" data-venue="A" aria-selected="true"></button>
            <button type="button" role="tab" id="tab-B" data-venue="B" aria-selected="false"></button>
          </div>
          <div class="legend" id="legend"></div>
          <div class="map-tools">
            <button type="button" class="tool" id="btn-rotate" aria-pressed="true" data-t="rotate"></button>
            <button type="button" class="tool" id="btn-reset" data-t="reset"></button>
          </div>
        </div>
        <div class="map-body">
          <div class="stage3d" id="stage3d">
            <div class="map-loading" id="map-loading" data-t="map_loading"></div>
            <div class="map-count" id="map-count"></div>
          </div>
          <aside class="map-side">
            <div id="booth-card"></div>
            <div class="blist" id="booth-list"></div>
          </aside>
        </div>
      </div>
    </div>
  </section>

  <section class="sec" id="join">
    <div class="wrap">
      <div class="sec-head"><span class="eyebrow" data-t="join_eyebrow"></span><h2 data-t="join_title"></h2><p data-t="join_sub"></p></div>
      <div class="pk-grid" id="packages"></div>
      <div class="join-lower">
        <div class="panel"><h3 data-t="addons_title"></h3><table class="tbl" id="addons"></table></div>
        <div class="panel"><h3 data-t="terms_title"></h3><ol class="steps" id="terms"></ol></div>
      </div>
      <div class="panel" style="margin-top:20px"><h3 data-t="cats_title"></h3><div class="cats" id="cats" style="margin-top:0"></div></div>
    </div>
  </section>

  <section class="sec" style="padding-top:0">
    <div class="wrap">
      <div class="sec-head"><span class="eyebrow" data-t="support_eyebrow"></span><h2 data-t="support_title"></h2></div>
      <div class="support" id="support"></div>
    </div>
  </section>

  <div class="dan-band" aria-hidden="true"></div>

  <section class="sec" id="schedule">
    <div class="wrap">
      <div class="sec-head"><span class="eyebrow" data-t="sched_eyebrow"></span><h2 data-t="sched_title"></h2></div>
      <ol class="tl tl-wrap" id="timeline"></ol>
    </div>
  </section>

  <section class="sec" id="program" style="padding-top:0">
    <div class="wrap">
      <div class="sec-head"><span class="eyebrow" data-t="prog_eyebrow"></span><h2 data-t="prog_title"></h2></div>
      <div class="prog" id="programs"></div>
    </div>
  </section>

  <section class="sec map-sec" id="apply">
    <div class="wrap">
      <div class="sec-head"><span class="eyebrow" data-t="apply_eyebrow"></span><h2 data-t="apply_title"></h2><p data-t="apply_sub"></p></div>
      <div class="apply-grid">
        <form class="form" id="form" novalidate>
          <div class="f"><label for="f-company"><span data-tf="company"></span><span class="req">*</span></label><input id="f-company" name="company" autocomplete="organization" required></div>
          <div class="f"><label for="f-person"><span data-tf="person"></span><span class="req">*</span></label><input id="f-person" name="person" autocomplete="name" required></div>
          <div class="f"><label for="f-phone"><span data-tf="phone"></span><span class="req">*</span></label><input id="f-phone" name="phone" type="tel" autocomplete="tel" required></div>
          <div class="f"><label for="f-msg" data-tf="msg"></label><input id="f-msg" name="msg"></div>
          <div class="f"><label for="f-email" data-tf="email"></label><input id="f-email" name="email" type="email" autocomplete="email"></div>
          <div class="f"><label for="f-cat"><span data-tf="cat"></span><span class="req">*</span></label><select id="f-cat" name="cat"></select></div>
          <div class="f"><label for="f-venue"><span data-tf="venue"></span><span class="req">*</span></label><select id="f-venue" name="venue"></select></div>
          <div class="f"><label for="f-pkg"><span data-tf="pkg"></span><span class="req">*</span></label><select id="f-pkg" name="pkg"></select></div>
          <div class="f"><label for="f-booth" data-tf="booth"></label><select id="f-booth" name="booth"></select></div>
          <div class="f"><label for="f-people" data-tf="people"></label><input id="f-people" name="people" type="number" min="0" max="10" value="1" inputmode="numeric"></div>
          <div class="f full"><span class="lbl" data-tf="addon"></span>
            <div class="checks">
              <label class="ck"><input type="checkbox" id="f-log" name="log"><span data-tf="log"></span></label>
              <label class="ck"><input type="checkbox" id="f-inf" name="inf"><span data-tf="inf"></span></label>
            </div>
          </div>
          <div class="f full"><label for="f-products"><span data-tf="products"></span><span class="req">*</span></label><input id="f-products" name="products" required></div>
          <div class="f full"><label for="f-memo" data-tf="memo"></label><textarea id="f-memo" name="memo"></textarea></div>
          <label class="agree f full"><input type="checkbox" id="f-agree" name="agree"><span data-tf="agree"></span></label>
          <p class="form-err" id="form-err" aria-live="polite"></p>
          <div class="f full"><button class="btn btn-red" type="submit" data-tf="submit"></button></div>
          <div class="done" id="done" hidden>
            <h3 data-t="done_title"></h3>
            <p data-t="done_text"></p>
            <textarea id="done-text" readonly aria-label="application"></textarea>
            <div class="btns"><button type="button" class="btn btn-jade" id="btn-copy" data-t="copy"></button><button type="button" class="btn btn-ghost" id="btn-edit" data-t="edit"></button></div>
          </div>
        </form>
        <aside class="est" id="est" aria-live="polite"></aside>
      </div>
    </div>
  </section>

  <section class="sec" id="faq">
    <div class="wrap">
      <div class="sec-head"><span class="eyebrow" data-t="faq_eyebrow"></span><h2 data-t="faq_title"></h2></div>
      <div class="faq" id="faq-list"></div>
    </div>
  </section>
</main>

<footer class="ftr">
  <div class="wrap">
    <a class="logo" href="#top"><span class="logo-mark" aria-hidden="true"></span><span class="logo-txt"><b>HAINAN K-CARNIVAL 2026–2027</b><span data-t="logo_sub"></span></span></a>
    <dl id="ft"></dl>
    <p class="note" data-t="ft_note"></p>
    <p class="note num">© 2026 Hainan Korea–China Culture &amp; Food Carnival</p>
  </div>
</footer>

<script src="i18n.js?v=1"></script>
<script src="app.js?v=1"></script>
<script type="module" src="map3d.js?v=1"></script>
</body>
</html>
